<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password · Study Buddy</title><link rel="stylesheet" href="/static/css/styles.css"></head><body class="shell"><main class="auth-card"><div class="eyebrow">ACCOUNT RECOVERY</div><h1>Choose a<br><em>new password.</em></h1>{% if error %}<div class="alert" role="alert">{{ error }}</div>{% endif %}<form method="post" action="/reset-password"><input type="hidden" name="token" value="{{ token }}"><label>Reset code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required></label><label>New password<input type="password" name="password" autocomplete="new-password" minlength="8" required></label><label>Confirm password<input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required></label><button type="submit">Update password ↗</button></form><p class="switch"><a href="/login">Back to sign in</a></p></main><aside class="quote"><div class="quote-copy"><span class="quote-kicker">PRIVATE BY DESIGN</span><p>Start your<br><strong>next lesson.</strong></p></div></aside></body></html>
