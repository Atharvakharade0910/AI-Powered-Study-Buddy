<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Study Buddy</title><link rel="stylesheet" href="/static/css/styles.css"></head><body class="dashboard"><header><div class="brand">✦ Study Buddy / Admin</div><form method="post" action="/logout"><button class="link-button" type="submit">Sign out</button></form></header><main class="content"><div class="eyebrow">ADMIN OVERVIEW</div><h1>System pulse.</h1><section class="grid"><article class="panel"><span class="label">USERS</span><div class="metric">{{ users|length }}</div></article><article class="panel"><span class="label">DOCUMENTS</span><div class="metric">{{ counts['documents'] }}</div></article><article class="panel"><span class="label">MESSAGES</span><div class="metric">{{ counts['messages'] }}</div></article></section><section class="panel"><span class="label">ACCOUNTS</span>{% for account in users %}<div class="item"><span>{{ account['identifier'] }}</span><small>{{ account['identifier_type']|title }}</small></div>{% endfor %}</section></main></body></html>
