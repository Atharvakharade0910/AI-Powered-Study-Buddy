services:
  study-buddy:
    build: .
    env_file:
      - .env
    environment:
      APP_ENV: development
      COOKIE_SECURE: "0"
      REDIS_URL: redis://redis:6379/0
    # Local Compose intentionally uses SQLite; Alembic is only run by the
    # PostgreSQL production Compose stack.
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    ports:
      - "8000:8000"
    volumes:
      - study_buddy_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - study_buddy_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  study_buddy_data:
  study_buddy_redis:
