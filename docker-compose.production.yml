services:
  study-buddy:
    build: .
    env_file:
      - path: .env.production
        required: false
    environment:
      APP_ENV: production
      COOKIE_SECURE: "1"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://studybuddy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/studybuddy
      PHONE_VERIFICATION_DEV_MODE: ${PHONE_VERIFICATION_DEV_MODE:-0}
      SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GEMINI_LIVE_MODEL: ${GEMINI_LIVE_MODEL:-gemini-3.1-flash-live-preview}
    # Publish the service for local smoke testing and a straightforward
    # single-host deployment. Put a reverse proxy/load balancer in front of
    # this port when scaling to multiple replicas.
    ports:
      - "8000:8000"
    volumes:
      - study_buddy_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - study_buddy_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studybuddy
      POSTGRES_USER: studybuddy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - study_buddy_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studybuddy -d studybuddy"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: always

volumes:
  study_buddy_data:
  study_buddy_redis:
  study_buddy_postgres:
